<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ARM Linux system overview</title>
  <desc id="desc">Evidence-aware architecture from host integration inputs through boot, kernel, device interfaces, and RK3566 platform.</desc>
  <rect width="1200" height="720" rx="28" fill="#111827"/>
  <text x="600" y="62" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="30" font-weight="700">ARM Linux System Integration Path</text>
  <text x="600" y="94" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16">Tspi-RK3566 · AArch64 · evidence-aware architecture review</text>

  <g font-family="system-ui, sans-serif">
    <rect x="100" y="128" width="760" height="76" rx="16" fill="#374151" stroke="#64748b" stroke-width="2"/>
    <text x="130" y="160" fill="#f8fafc" font-size="20" font-weight="700">Build Inputs</text>
    <text x="130" y="185" fill="#cbd5e1" font-size="15">AArch64 toolchain · U-Boot workflow · kernel tree · board description · rootfs</text>
