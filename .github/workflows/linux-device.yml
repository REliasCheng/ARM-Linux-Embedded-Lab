name: Linux device and ARM64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: ${{ matrix.compiler }} native PTY
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Record tool versions
        run: |
          uname -a
          ${{ matrix.compiler }} --version | head -n 1
          cmake --version | head -n 1
          python3 --version
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          cmake --build build --parallel 4
      - name: Real kernel PTY integration
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pty-evidence-${{ matrix.compiler }}
          path: build/artifacts/
          if-no-files-found: warn

  sanitizers:
    name: ASan + UBSan native PTY
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Instrumented build
        run: |
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build-san --parallel 4
      - name: Instrumented tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pty-evidence-sanitizers
          path: build-san/artifacts/
          if-no-files-found: warn

  aarch64:
    name: AArch64 cross build and QEMU userspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install distribution cross toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user file ninja-build
      - name: Record tool versions
        run: |
          dpkg-query -W gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user libc6-arm64-cross
          aarch64-linux-gnu-gcc --version | head -n 1
          qemu-aarch64 --version | head -n 1
      - name: Cross build and inspect ELF
        run: |
          cmake -S . -B build-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64-linux-gnu.cmake
          cmake --build build-arm64 --parallel 4
          file build-arm64/device_monitor build-arm64/test_protocol
          aarch64-linux-gnu-readelf -h -l build-arm64/device_monitor
      - name: Execute real AArch64 binaries under QEMU
        run: |
          timeout 15s qemu-aarch64 -L /usr/aarch64-linux-gnu build-arm64/test_protocol
          timeout 15s python3 tests/pty_integration.py --scenario normal --monitor build-arm64/device_monitor --simulator tools/pty_device_simulator.py --wrapper 'qemu-aarch64 -L /usr/aarch64-linux-gnu'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pty-evidence-aarch64-qemu
          path: artifacts/
          if-no-files-found: warn

  module:
    name: x86_64 host Kbuild, no load
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install distribution headers and tools
        run: sudo apt-get update && sudo apt-get install -y linux-headers-generic build-essential binutils kmod file
      - name: Build real external module against packaged headers
        run: |
          KDIR=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)
          test -n "$KDIR" && test -f "$KDIR/Makefile"
          printf 'runner_kernel=%s\nheaders=%s\n' "$(uname -r)" "$KDIR"
          dpkg-query -W 'linux-headers-*' | tail -n 8
          make -C "$KDIR" M="$PWD/kernel" modules
          test -s kernel/lab_echo.ko
          file kernel/lab_echo.ko
          readelf -h kernel/lab_echo.ko
          modinfo kernel/lab_echo.ko
          sha256sum kernel/lab_echo.ko
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-kbuild-evidence
          path: kernel/lab_echo.ko
          if-no-files-found: warn
